<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Momento 💖 Make a Little Surprise</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 18px;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffe0ec, #e8e2ff, #dff8ff);
  color: #403047;
}

.container {
  max-width: 520px;
  margin: 20px auto;
  padding: 24px;
  background: white;
  border-radius: 22px;
  box-shadow: 0 8px 30px #00000015;
}

h1 {
  text-align: center;
  color: #d63384;
}

.subtitle {
  text-align: center;
  color: #796a80;
  line-height: 1.6;
}

label {
  display: block;
  margin-top: 18px;
  margin-bottom: 7px;
  font-weight: bold;
}

input,
textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #e4c8e0;
  border-radius: 12px;
  font-size: 16px;
  background: #fffaff;
}

textarea {
  min-height: 120px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 18px;
  border: none;
  border-radius: 12px;
  background: #e83e8c;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
}

.preview {
  display: none;
  width: 100%;
  max-height: 350px;
  object-fit: contain;
  margin-top: 15px;
  border-radius: 15px;
}

#status {
  padding: 12px;
  margin-top: 18px;
  border-radius: 10px;
  background: #f8efff;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.6;
}

#shareBox {
  display: none;
  padding: 15px;
  margin-top: 18px;
  border-radius: 12px;
  background: #e8fff0;
}

#shareLink {
  display: block;
  margin-top: 10px;
  word-break: break-all;
}

#surpriseView {
  display: none;
  text-align: center;
}

#surpriseMessage {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.8;
  font-size: 18px;
}

#surpriseMusic {
  width: 100%;
  margin-top: 20px;
}

.small {
  font-size: 13px;
  color: #796a80;
  line-height: 1.6;
}
</style>
</head>

<body>

<div class="container" id="creator">

  <h1>💖 Momento</h1>

  <p class="subtitle">
    Make a little surprise for someone special ✨
  </p>

  <form id="surpriseForm">

    <label for="recipient">Surprise kis ke liye hai?</label>

    <input
      id="recipient"
      type="text"
      placeholder="Enter their name"
      maxlength="80"
      required
    >

    <label for="message">Your Surprise Message</label>

    <textarea
      id="message"
      placeholder="Write your special message here..."
      maxlength="5000"
      required
    ></textarea>

    <label for="photo">Choose Photo</label>

    <input
      id="photo"
      type="file"
      accept="image/*"
    >

    <img id="photoPreview" class="preview" alt="Photo preview">

    <label for="music">Choose Music</label>

    <input
      id="music"
      type="file"
      accept="audio/*"
    >

    <p class="small">
      Photo limit: 1 MB<br>
      Music limit: 3 MB
    </p>

    <button id="createButton" type="submit">
      💝 Create Surprise Link
    </button>

  </form>

  <div id="status" role="status" aria-live="polite">
    Apni details bharo aur surprise banao.
  </div>

  <div id="shareBox">
    <strong>🎉 Your surprise link is ready!</strong>

    <a id="shareLink" target="_blank" rel="noopener"></a>

    <button id="copyButton" type="button">
      📋 Copy Link
    </button>
  </div>

</div>


<div class="container" id="surpriseView">

  <h1>💖 A Little Surprise For You 💖</h1>

  <h2 id="surpriseName"></h2>

  <img
    id="surprisePhoto"
    class="preview"
    alt="Surprise photo"
  >

  <p id="surpriseMessage"></p>

  <audio
    id="surpriseMusic"
    controls
    style="display:none"
  ></audio>

  <p class="subtitle">Made with love 💕</p>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getAuth,
  signInAnonymously
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  setDoc,
  getDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";


/* YOUR FIREBASE CONFIG */

const firebaseConfig = {
  apiKey: "AIzaSyCFIM9hfuLrX67x9NUm1girCH0OE1J4FFo",
  authDomain: "momento-surprise.firebaseapp.com",
  projectId: "momento-surprise",
  storageBucket: "momento-surprise.firebasestorage.app",
  messagingSenderId: "81623724692",
  appId: "1:81623724692:web:b095309639b171aff43a81",
  measurementId: "G-VTGEK2GV32"
};


const $ = id => document.getElementById(id);

const form = $("surpriseForm");
const button = $("createButton");
const statusBox = $("status");

let app;
let auth;
let db;
let storage;
let firebaseReady = false;


function showStatus(message) {
  statusBox.textContent = message;
}


/* INITIALIZE FIREBASE */

try {
  app = initializeApp(firebaseConfig);

  auth = getAuth(app);
  db = getFirestore(app);
  storage = getStorage(app);

  firebaseReady = true;

} catch (error) {
  showStatus("Firebase error: " + error.message);
}


/* PHOTO PREVIEW */

$("photo").addEventListener("change", () => {

  const file = $("photo").files[0];
  const preview = $("photoPreview");

  if (!file) {
    preview.style.display = "none";
    preview.removeAttribute("src");
    return;
  }

  if (!file.type.startsWith("image/")) {
    showStatus("Please choose a valid image.");
    $("photo").value = "";
    return;
  }

  if (file.size > 1024 * 1024) {
    showStatus("Photo 1 MB se chhoti honi chahiye.");
    $("photo").value = "";
    return;
  }

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";

  showStatus("Photo selected successfully! 💖");

});


/* CREATE SURPRISE */

form.addEventListener("submit", async (event) => {

  event.preventDefault();

  if (!firebaseReady) {
    showStatus("Firebase initialize nahi hua. Page refresh karke try karo.");
    return;
  }

  const recipient = $("recipient").value.trim();
  const message = $("message").value.trim();
  const photoFile = $("photo").files[0];
  const musicFile = $("music").files[0];

  if (!recipient || !message) {
    showStatus("Name aur message dono bharna zaroori hai.");
    return;
  }

  if (photoFile && photoFile.size > 1024 * 1024) {
    showStatus("Photo 1 MB se chhoti rakho.");
    return;
  }

  if (musicFile && musicFile.size > 3 * 1024 * 1024) {
    showStatus("Music file 3 MB se chhoti rakho.");
    return;
  }

  button.disabled = true;
  button.textContent = "Please wait...";

  $("shareBox").style.display = "none";

  try {

    showStatus("Connecting to Firebase...");

    const credential = await signInAnonymously(auth);
    const user = credential.user;

    const surpriseRef = doc(collection(db, "surprises"));
    const surpriseId = surpriseRef.id;

    let photoURL = "";
    let musicURL = "";

    /* UPLOAD PHOTO */

    if (photoFile) {

      showStatus("Uploading photo...");

      const photoRef = ref(
        storage,
        `surprises/${user.uid}/${surpriseId}/photo`
      );

      await uploadBytes(photoRef, photoFile, {
        contentType: photoFile.type
      });

      photoURL = await getDownloadURL(photoRef);

    }

    /* UPLOAD MUSIC */

    if (musicFile) {

      showStatus("Uploading music...");

      const musicRef = ref(
        storage,
        `surprises/${user.uid}/${surpriseId}/music`
      );

      await uploadBytes(musicRef, musicFile, {
        contentType: musicFile.type
      });

      musicURL = await getDownloadURL(musicRef);

    }

    /* SAVE SURPRISE */

    showStatus("Saving surprise...");

    await setDoc(surpriseRef, {
      recipient: recipient,
      message: message,
      photoURL: photoURL,
      musicURL: musicURL,
      createdBy: user.uid,
      createdAt: serverTimestamp()
    });

    /* GENERATE SHARE LINK */

    const shareURL =
      location.origin +
      location.pathname +
      "?id=" +
      encodeURIComponent(surpriseId);

    $("shareLink").href = shareURL;
    $("shareLink").textContent = shareURL;

    $("shareBox").style.display = "block";

    showStatus("🎉 Surprise successfully saved!");

  } catch (error) {

    console.error(error);

    showStatus(
      "Surprise save nahi hua.\n\n" +
      "Error code: " + (error.code || "unknown") +
      "\nMessage: " + error.message
    );

  } finally {

    button.disabled = false;
    button.textContent = "💝 Create Surprise Link";

  }

});


/* COPY LINK */

$("copyButton").addEventListener("click", async () => {

  const link = $("shareLink").href;

  try {

    await navigator.clipboard.writeText(link);

    showStatus("Link copied successfully! 💖");

  } catch (error) {

    showStatus("Link ko select karke copy karo:\n" + link);

  }

});


/* OPEN SURPRISE LINK */

async function openSurprise() {

  const params = new URLSearchParams(location.search);
  const id = params.get("id");

  if (!id) return;

  $("creator").style.display = "none";
  $("surpriseView").style.display = "block";

  try {

    const snapshot = await getDoc(doc(db, "surprises", id));

    if (!snapshot.exists()) {

      $("surpriseMessage").textContent =
        "Surprise nahi mila. Link check karo.";

      return;
    }

    const data = snapshot.data();

    $("surpriseName").textContent = "For " + data.recipient;
    $("surpriseMessage").textContent = data.message;

    if (data.photoURL) {

      $("surprisePhoto").src = data.photoURL;
      $("surprisePhoto").style.display = "block";

    }

    if (data.musicURL) {

      $("surpriseMusic").src = data.musicURL;
      $("surpriseMusic").style.display = "block";

    }

  } catch (error) {

    console.error(error);

    $("surpriseMessage").textContent =
      "Surprise load nahi hua: " + error.message;

  }

}

openSurprise();

</script>

</body>
</html>
